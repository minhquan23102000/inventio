[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventio-gdrive"
version = "0.1.0"
description = "Google Drive documents as an inventio source"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["inventio>=0.5.5"]  # Client.raw, inventio.pdf and `inventio login` for plugins

[project.entry-points."inventio.connectors"]
gdrive = "inventio_gdrive"

[tool.setuptools]
py-modules = ["inventio_gdrive"]
