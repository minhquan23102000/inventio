[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventio"
version = "0.1.0"
description = "Local retrieval without embeddings: BM25 + source structure + code-drawn links, reranked by dispositio or TypeSafe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["tree-sitter-language-pack>=1.0"]  # functions and classes as chunks; small wheels

[project.urls]
Homepage = "https://github.com/minhquan23102000/inventio"
Model = "https://huggingface.co/minhquan2310/dispositio"

[project.optional-dependencies]
laya = ["laya>=0.3.6"]
typesafe = ["typesafe-sdk>=0.7"]
data = ["duckdb>=1.0", "sqlalchemy>=2.0", "confluent-kafka>=2.3", "boto3"]  # schema cards; add your database's driver
bench = ["datasets"]
dev = ["pytest"]

[project.scripts]
inventio = "inventio.cli:main"

[tool.setuptools]
packages = ["inventio", "inventio.connectors"]
