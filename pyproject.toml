[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-atlas"
version = "0.1.0"
description = "Local retrieval without embeddings: BM25 + source structure + code-drawn links, reranked by Laya or TypeSafe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
laya = ["laya>=0.3.6"]
typesafe = ["typesafe-sdk>=0.7"]
dev = ["pytest"]

[project.scripts]
laya-atlas = "laya_atlas.cli:main"

[tool.setuptools]
packages = ["laya_atlas"]
