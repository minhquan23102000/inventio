[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventio"
dynamic = ["version"]
description = "Local retrieval without embeddings: BM25 + source structure + code-drawn links, reranked by dispositio or TypeSafe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "tree-sitter-language-pack>=1.0",  # functions and classes as chunks; small wheels
    "keyring>=24",                     # logins kept in the OS keychain (`inventio login`)
]

[project.urls]
Homepage = "https://github.com/minhquan23102000/inventio"
Model = "https://huggingface.co/minhquan2310/dispositio"

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7"]
data = ["duckdb>=1.0", "sqlalchemy>=2.0", "confluent-kafka>=2.3", "boto3"]  # schema cards; add your database's driver
bench = ["datasets"]
# dispositio (ranker, judge, type head): a checkpoint read in this process (inventio/_systemone — Kev's
# serving path, vendored, Apache-2.0). torch, transformers and peft are the runtime; pydantic is the request schema.
dispositio = ["torch>=2.6", "transformers>=5.17,<6", "peft>=0.21", "pydantic>=2.9"]
dev = ["pytest"]

[project.scripts]
inventio = "inventio.cli:main"

[tool.setuptools.dynamic]
version = { attr = "inventio.__version__" }

[tool.setuptools]
packages = ["inventio", "inventio._systemone", "inventio.connectors"]

[tool.setuptools.package-data]
inventio = ["skill/SKILL.md"]  # `inventio skill` copies it into .agents/skills
