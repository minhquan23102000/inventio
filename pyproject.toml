[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventio"
version = "0.1.0"
description = "Local retrieval without embeddings: BM25 + source structure + code-drawn links, reranked by dispositio or TypeSafe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
code = ["tree-sitter-language-pack>=1.0"]
laya = ["laya>=0.3.6"]
typesafe = ["typesafe-sdk>=0.7"]
bench = ["datasets"]
dev = ["pytest"]

[project.scripts]
inventio = "inventio.cli:main"

[tool.setuptools]
packages = ["inventio"]
